# bpfagent configuration file

# Daemon settings
pid_file = "/tmp/bpfagent.pid"
working_directory = "/"
log_file = "/tmp/bpfagent.log"

[[ebpf_programs]]
name = "sca"
enabled = false

# EBPF programs to load and run
[[ebpf_programs]]
name = "kfree_skb"
enabled = true

[[ebpf_programs]]
name = "irss"
enabled = false
# Optional: listen_port (default 5020) and raw_dest (default 10.10.10.253),
# see config/bpfagent.conf.full

# Uncomment to test iflat against iflat_sim's topology
# (rx = veth-iflat0, tx = tun0):
# [[ebpf_programs]]
# name = "iflat"
# enabled = true
# stats_interval_ms is a daemon-level key, not per-program
# [ebpf_programs.settings]
# rx_iface = "veth-iflat0"
# tx_iface = "tun0"

# Uncomment to test iflat_uprobe against iflat_uprobe_sim's topology
# (rx1 = veth-iu0, rx2 = tun0; the sim prints target/pid at startup):
# [[ebpf_programs]]
# name = "iflat_uprobe"
# enabled = true
# [ebpf_programs.settings]
# rx1_iface = "veth-iu0"
# rx2_iface = "tun0"
# target = "/path/to/target/debug/examples/iflat_uprobe_sim"
# symbol = "iflat_uprobe_sim_submit"
# pid = -1
# arg_index = 3
# payload_ptr_offset = 296
# tag_offset = 0
