[workspace]
resolver = "2"
members = [
    "bpfagent",
    "common/kfree_skb",
    "common/sca",
    "ebpf/kfree_skb",
    "ebpf/sca",
]
default-members = ["bpfagent", "common/kfree_skb", "common/sca"]

[workspace.package]
license = "MIT OR Apache-2.0"
edition = "2021"

[workspace.dependencies]
aya = { git = "https://github.com/aya-rs/aya", default-features = false }
aya-build = { git = "https://github.com/aya-rs/aya", default-features = false }
aya-ebpf = { git = "https://github.com/aya-rs/aya", default-features = false }
aya-log = { git = "https://github.com/aya-rs/aya", default-features = false }
aya-log-ebpf = { git = "https://github.com/aya-rs/aya", default-features = false }

anyhow = { version = "1", default-features = false }
cargo_metadata = { version = "0.23.0", default-features = false }
# `std` feature is currently required to build `clap`.
#
# See https://github.com/clap-rs/clap/blob/61f5ee5/clap_builder/src/lib.rs#L15.
clap = { version = "4.5.20", default-features = false, features = ["std", "derive", "help"] }
env_logger = { version = "0.11.5", default-features = false, features = ["default"] }
libc = { version = "0.2.187", default-features = false }
log = { version = "0.4.22", default-features = false }
prometheus = { version = "0.13", default-features = false, features = ["process"] }
tokio = { version = "1.40.0", default-features = false }
tokio-util = { version = "0.7", default-features = false }
which = { version = "6.0.0", default-features = false }
serde = { version = "1.0", default-features = false }
toml = { version = "0.8.14", default-features = false, features = ["parse"] }

[profile.release.package.kfree_skb-ebpf]
debug = 2
codegen-units = 1
strip = false