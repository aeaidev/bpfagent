name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Create GitHub release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            ## Changes
            See CHANGELOG.md for detailed changes.
          draft: false
          prerelease: false

  # Build binaries for multiple platforms
  build:
    name: Build Release Binary
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: bpfagent
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: bpfagent-musl
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang libelf-dev
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Strip binary
        run: strip bpfagent/target/${{ matrix.target }}/release/bpfagent || true
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: bpfagent/target/${{ matrix.target }}/release/bpfagent
          asset_name: ${{ matrix.binary }}-${{ matrix.target }}
          asset_content_type: application/octet-stream

  # Build and push Docker image
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v2
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v4
        with:
          context: .
          file: examples/docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/bpfagent:latest
            ${{ secrets.DOCKER_USERNAME }}/bpfagent:${{ github.ref_name }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/bpfagent:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/bpfagent:buildcache,mode=max
