# bpfagent configuration file
# Place this file at /etc/bpfagent.conf or ~/.bpfagent.conf

[daemon]
# PID file location
pid_file = "/tmp/bpfagent.pid"

# Working directory
working_directory = "/"

# User and group to run as
user = "root"
group = "root"

# Log file location
log_file = "/tmp/bpfagent.log"
